name: Node Checks

permissions:
    contents: read

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    lint-js:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10

            - name: Install node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'pnpm'
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install

            - name: Run lint js
              run: pnpm lint:js

    lint-css:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10

            - name: Install Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'pnpm'
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install

            - name: Run lint css
              run: pnpm lint:css
