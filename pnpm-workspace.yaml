packages:
  - 'themes/bluekelpie-theme'
  - 'mu-plugins/bluekelpie-plugin'

shamefullyHoist: true

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  core-js-pure: true
  esbuild: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - core-js
  - core-js-pure
  - esbuild
  - sharp
  - unrs-resolver
